project_id = "pmmg"

[auth]
site_url = "https://app.notaalvo.com.br"
additional_redirect_urls = [
  "https://app.notaalvo.com.br/**",
  "https://notaalvo.com.br/**",
  "https://www.notaalvo.com.br/**",
  "https://rota-pmmg.vercel.app/**",
  "https://pmmg-livid.vercel.app/**",
  "https://pmmg-ti-semeando-vidas.vercel.app/**",
  "http://localhost:3000/**"
]
enable_signup = true

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
